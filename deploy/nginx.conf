# /etc/nginx/sites-available/jaathiya-vaarthalu  (replace your-domain.example and the project path)
# HTTPS: run `sudo certbot --nginx -d your-domain.example` after enabling this site.
server {
    listen 80;
    server_name your-domain.example;
    charset utf-8;
    client_max_body_size 55m;            # e-paper PDFs up to 50 MB

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    # uploads are served by Nginx directly
    location /uploads/ {
        alias /srv/jaathiya-vaarthalu/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
    }
    location /fonts/ { alias /srv/jaathiya-vaarthalu/public/fonts/; expires 365d; add_header Cache-Control "public, immutable"; }
    location /css/   { alias /srv/jaathiya-vaarthalu/public/css/;   expires 1h; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
