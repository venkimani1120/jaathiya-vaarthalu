# Tests both services and builds the static site on every push and pull request; publishes main to GitHub Pages.
# The hourly run publishes stories whose published_at time has arrived, starts/ends ads on their dates and
# picks up news approved in the desk app since the last run.
# One-time setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Build and publish

on:
  push:
    # static-setup publishes too, for an online preview before merging. Remove it once main is live.
    # The branch must also be allowed in Settings > Environments > github-pages > Deployment branches.
    branches: [main, static-setup]
  pull_request:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run install:all
      - run: npm test
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      # The static site is the frontend's pages from a backend started here. NEWS_API_URL (Settings > Secrets and
      # variables > Actions > Variables) is the news desk app on Render, e.g. https://jaathiya-vaartalu-studio-app.onrender.com.
      # Its approved news and published e-papers are added on every run except pull requests; leave it unset to build
      # from backend/content/ only. A content mistake or an unreachable desk app fails the run, so the live site stays as it was.
      - name: Start the backend
        env:
          PORT: '4000'
          NEWS_API_URL: ${{ github.event_name != 'pull_request' && vars.NEWS_API_URL || '' }}
          NEWS_DAYS: ${{ vars.NEWS_DAYS }}
        run: |
          node backend/src/server.js > backend.log 2>&1 &
          echo $! > backend.pid
          for i in $(seq 240); do
            curl -sf http://localhost:4000/healthz && exit 0
            kill -0 "$(cat backend.pid)" 2>/dev/null || { cat backend.log; exit 1; }
            sleep 2
          done
          cat backend.log; exit 1
      # base_url is https://<user>.github.io/<repo>, or the custom domain once one is set in Settings > Pages
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url || 'https://example.github.io/preview' }}
          API_URL: http://localhost:4000
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/static-setup')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
